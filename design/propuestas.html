<title>Propuestas Viaje Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Presentation page: neutral frame; each proposal paints its own phones. */
:root {
  --page: #EEF1F5; --ink: #12192A; --muted: #5D6678; --line: #D9DEE6; --card: #FFFFFF; --pick: #12A664;
  --sans: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0A0F18; --ink: #E8ECF3; --muted: #93A0B5; --line: #1E2736; --card: #121A27; color-scheme: dark } }
:root[data-theme="dark"] { --page: #0A0F18; --ink: #E8ECF3; --muted: #93A0B5; --line: #1E2736; --card: #121A27; color-scheme: dark }
body { background: var(--page); color: var(--ink); font-family: var(--sans); padding-inline: 20px; padding-block: 32px 64px; }
.wrap { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }
header.page { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
header.page .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
header.page h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.05; font-weight: 800; text-wrap: balance; }
header.page p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
.jump { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.jump a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.jump a:focus-visible, .jump a:hover { border-color: var(--ink); }
section.prop { display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 20px; }
.prop-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.prop-head > div { min-width: 0; max-width: 680px; display: flex; flex-direction: column; gap: 8px; }
.prop-head .tag { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.prop-head h2 { margin: 0; font-size: clamp(22px, 3vw, 32px); font-weight: 800; }
.prop-head p { margin: 0; color: var(--muted); line-height: 1.55; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; max-width: 560px; }
.sw { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sw i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
.rail { overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
.phones { display: flex; gap: 22px; width: max-content; }
.phone-wrap { display: flex; flex-direction: column; gap: 10px; scroll-snap-align: start; }
.phone-wrap .cap { font-size: 13px; font-weight: 600; color: var(--muted); padding-left: 4px; }
.phone { width: 320px; height: 668px; border-radius: 40px; padding: 10px; background: #0B0E14; box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 20px 40px -24px rgba(10,15,30,.45); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 31px; overflow: hidden; display: flex; flex-direction: column; background: var(--s-bg); color: var(--s-ink); font-family: var(--s-font); }
.notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 92px; height: 24px; background: #0B0E14; border-radius: 14px; z-index: 5; }
.status { height: 38px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 700; color: var(--s-status, var(--s-ink)); }
.scroll { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 16px; }
svg.ic { width: 1em; height: 1em; flex: none; display: block; }

/* Shared screen pieces, styled through each proposal's tokens */
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.eyebrow-s { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--s-muted); }
.h1 { font-size: 23px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.h2 { font-size: 16px; line-height: 1.3; font-weight: 700; margin: 0; }
.p { font-size: 13px; line-height: 1.45; color: var(--s-muted); margin: 0; }
.small { font-size: 11.5px; color: var(--s-muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 6px 9px; border-radius: 999px; background: var(--s-chip); color: var(--s-ink); white-space: nowrap; }
.chip .ic { font-size: 13px; }
.bar { height: 6px; border-radius: 6px; background: var(--s-track); overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 6px; background: var(--s-accent); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--s-btn-r); background: var(--s-accent); color: var(--s-on-accent); font-weight: 800; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--s-ink); border: 1px solid var(--s-line); }
.card { background: var(--s-card); border: 1px solid var(--s-line); border-radius: var(--s-card-r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.cover { height: 96px; border-radius: calc(var(--s-card-r) - 4px); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 10px; color: #fff; }
.cover .art { position: absolute; inset: 0; }
.cover .big { position: absolute; right: 12px; top: 12px; font-size: 40px; opacity: .95; }
.cover .lbl { position: relative; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.28); padding: 4px 8px; border-radius: 6px; }
.hscroll { display: flex; gap: 10px; overflow: hidden; }
.mini { flex: none; width: 132px; border-radius: var(--s-card-r); background: var(--s-card); border: 1px solid var(--s-line); overflow: hidden; }
.mini .cover { height: 70px; border-radius: 0; }
.mini .body { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 4px; }
.mini .t { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
.ring { width: 46px; height: 46px; flex: none; }
.tabbar { flex: none; display: flex; justify-content: space-around; padding: 8px 6px 18px; background: var(--s-tab-bg); border-top: 1px solid var(--s-line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--s-muted); width: 70px; }
.tab .ic { font-size: 22px; }
.tab.on { color: var(--s-tab-on); }
.station { display: flex; gap: 12px; }
.station .node { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1.5px solid var(--s-line); background: var(--s-card); color: var(--s-muted); position: relative; z-index: 1; }
.station .node.done { background: var(--s-accent); border-color: var(--s-accent); color: var(--s-on-accent); }
.station .node.cur { border-color: var(--s-accent); color: var(--s-accent); box-shadow: 0 0 0 4px var(--s-glow); }
.track { position: relative; display: flex; flex-direction: column; gap: 12px; }
.track::before { content: ""; position: absolute; left: 18.5px; top: 18px; bottom: 18px; width: 2px; background: var(--s-line); }
.lesson { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--s-line); }
.lesson:first-child { border-top: 0; }
.num { width: 28px; height: 28px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: var(--s-chip); color: var(--s-muted); }
.num.done { background: var(--s-accent); color: var(--s-on-accent); }
.num.cur { background: var(--s-ink); color: var(--s-bg); }
.price { font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: var(--s-price-bg); color: var(--s-price); white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.bubble { max-width: 82%; padding: 10px 12px; border-radius: 16px; font-size: 13px; line-height: 1.45; }
.bubble.them { background: var(--s-card); border: 1px solid var(--s-line); border-bottom-left-radius: 5px; align-self: flex-start; }
.bubble.me { background: var(--s-accent); color: var(--s-on-accent); border-bottom-right-radius: 5px; align-self: flex-end; font-weight: 600; }
.composer { flex: none; display: flex; gap: 8px; padding: 10px 14px 18px; border-top: 1px solid var(--s-line); background: var(--s-tab-bg); }
.composer .in { flex: 1; height: 40px; border-radius: 20px; background: var(--s-card); border: 1px solid var(--s-line); display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: var(--s-muted); }
.round { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--s-accent); color: var(--s-on-accent); font-size: 18px; flex: none; }
.avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--s-accent); color: var(--s-on-accent); position: relative; }
.avatar .on { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: #3BD671; border: 2px solid var(--s-bg); }
.segment { display: flex; gap: 18px; border-bottom: 1px solid var(--s-line); }
.segment span { padding: 8px 0; font-size: 12.5px; font-weight: 700; color: var(--s-muted); }
.segment span.on { color: var(--s-ink); box-shadow: inset 0 -2px 0 var(--s-accent); }

/* ── Proposal A · Ruta nocturna: Platzi-like dark navy, bright green ── */
.pa { --s-bg: #0B1424; --s-card: #121F36; --s-chip: #1A2A47; --s-track: #1E2F4F; --s-line: rgba(160,185,230,.12); --s-ink: #EAF0FA; --s-muted: #8C9DBB; --s-accent: #2FE07D; --s-on-accent: #04230F; --s-glow: rgba(47,224,125,.18); --s-tab-bg: #0E1A2E; --s-tab-on: #2FE07D; --s-price-bg: rgba(255,182,72,.14); --s-price: #FFB648; --s-font: "Plus Jakarta Sans", system-ui, sans-serif; --s-card-r: 16px; --s-btn-r: 12px; }
/* ── Proposal B · Aula clara: light, airy, navy ink, green progress ── */
.pb { --s-bg: #F4F6FA; --s-card: #FFFFFF; --s-chip: #EBEFF5; --s-track: #E3E8F0; --s-line: #E3E8F0; --s-ink: #10203B; --s-muted: #5F6E87; --s-accent: #12A664; --s-on-accent: #FFFFFF; --s-glow: rgba(18,166,100,.14); --s-tab-bg: #FFFFFF; --s-tab-on: #10203B; --s-price-bg: #FFF1DD; --s-price: #B36B00; --s-font: "Manrope", system-ui, sans-serif; --s-card-r: 14px; --s-btn-r: 999px; }
/* ── Proposal C · Escuela: navy header blocks over a white body, certificate gold ── */
.pc { --s-bg: #FFFFFF; --s-card: #FFFFFF; --s-chip: #EEF2F7; --s-track: #E6EBF2; --s-line: #E6EBF2; --s-ink: #0E1A30; --s-muted: #64708A; --s-accent: #1BC47D; --s-on-accent: #04261A; --s-glow: rgba(27,196,125,.16); --s-tab-bg: #FFFFFF; --s-tab-on: #0E1A30; --s-price-bg: #0E1A30; --s-price: #FFFFFF; --s-font: "Plus Jakarta Sans", system-ui, sans-serif; --s-card-r: 18px; --s-btn-r: 14px; --navy: #0E1A30; --gold: #E7B85A; }
.pc .hero { background: var(--navy); color: #F2F5FA; margin: -6px -16px 0; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 12px; border-radius: 0 0 26px 26px; }
.pc .hero .p, .pc .hero .small, .pc .hero .eyebrow-s { color: #A9B4C9; }
.pc .hero .chip { background: rgba(255,255,255,.08); color: #F2F5FA; }
.pc .hero .bar { background: rgba(255,255,255,.12); }
.pc .screen.dark-top { --s-status: #F2F5FA; }
.pc .status-navy { background: var(--navy); }
.pc .cert { background: linear-gradient(0deg, #FFF8E8, #FFF8E8); border: 1px solid #F1DDAF; }
.pc .serif { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -.01em; }
@media (prefers-reduced-motion: no-preference) { .phone { transition: transform .25s ease; } .phone:hover { transform: translateY(-3px); } }
@media (max-width: 520px) { body { padding-inline: 16px; } }
</style>

<div class="wrap">
  <header class="page">
    <span class="eyebrow">Viaje Financiero · Exploración de diseño</span>
    <h1>Tres direcciones inspiradas en Platzi</h1>
    <p>Mismo contenido y mismas cuatro pantallas en las tres: Inicio, Ruta, Estación y Mentor. Desliza cada fila para ver las pantallas y dime con cuál nos quedamos (o qué mezclar).</p>

</div>

function ic(name, weight = 'regular') {
  const paths = ICONS[name + ':' + weight] || ICONS[name + ':regular'] || [];
  return `<svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${paths.map(d => `<path d="${d}"/>`).join('')}</svg>`;
}
function ring(pct, color, track) {
  const r = 19, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="${r}" fill="none" stroke="${track}" stroke-width="5"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">${pct}%</text></svg>`;
}
/* Cover art per station: flat colour, concentric arcs, the station icon. */
const COVERS = {
  1: ['#1B6B4A', '#2FA36F', 'compass'],
  2: ['#1E4E8C', '#3C7DD9', 'plant'],
  3: ['#7A3F1C', '#C46A2E', 'door'],
  4: ['#3D3F8F', '#6366C9', 'map'],
};
function cover(id, label, h) {
  const [a, b, icon] = COVERS[id];
  return `<div class="cover" style="background:${a};${h ? 'height:' + h + 'px' : ''}">
    <svg class="art" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="250" cy="20" r="90" fill="none" stroke="${b}" stroke-width="16" opacity=".55"/><circle cx="250" cy="20" r="52" fill="none" stroke="${b}" stroke-width="10" opacity=".75"/></svg>
    <span class="big">${ic(icon)}</span>${label ? `<span class="lbl">${label}</span>` : ''}</div>`;
}
const status = `<div class="status"><span>9:41</span><span style="display:flex;gap:5px;align-items:center">${ic('lightning','fill')}100%</span></div>`;
function tabbar(on) {
  const t = [['home', 'Inicio'], ['map', 'Ruta'], ['chat', 'Mentor'], ['passport', 'Perfil']];
  return `<nav class="tabbar">${t.map(([i, l]) => `<span class="tab ${l === on ? 'on' : ''}">${ic(i, l === on ? 'fill' : 'regular')}${l}</span>`).join('')}</nav>`;
}

    <div class="bubble them">Hola, Diana. Antes de hablar de números, quiero entender tu historia. ¿Qué pasa con tu dinero a fin de mes?</div>
    <div class="bubble me">Siento que se me va sin darme cuenta. Me da ansiedad revisar la cuenta.</div>
    <div class="bubble me" style="display:flex;align-items:center;gap:10px">${ic('play','fill')}<span style="display:flex;gap:2px;align-items:center">${[6,11,16,9,18,13,8,15,19,11,7,14].map(h => `<i style="display:block;width:2px;height:${h}px;border-radius:1px;background:currentColor;opacity:.7"></i>`).join('')}</span><span style="font-size:11px">0:42</span></div>
    <div class="bubble them">Gracias por contarlo con tanta honestidad. ¿Qué aprendiste en casa sobre el dinero?</div>
    <div class="small" style="align-self:center">Victor está escribiendo…</div>
  </div>`;
  return `${status}<div class="scroll">${head}${msgs}</div><div class="composer"><span class="in">Escribe a Victor…</span><span class="round" style="background:transparent;border:1px solid var(--s-line);color:var(--s-ink)">${ic('mic')}</span></div>`;
}
